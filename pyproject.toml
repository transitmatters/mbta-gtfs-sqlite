[project]
name = "mbta-gtfs-sqlite"
version = "1.2.0"
description = "Query the MBTA's static GTFS feeds using sqlite"
authors = [{ name = "Ian Reynolds", email = "ireynolds@transitmatters.info" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "requests>=2.32.5,<3",
    "SQLAlchemy>=2.0.43,<3",
    "more-itertools>=10.8.0,<12",
]

[dependency-groups]
dev = [
    # memray only supports Linux and macOS.
    "memray>=1.19.0 ;  sys_platform != 'win32'",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.sdist]
include = ["mbta_gtfs_sqlite", "README.md"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
